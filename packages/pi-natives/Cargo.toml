[package]
name = "pi-natives"
version = "0.1.0"
edition = "2021"
description = "Native N-API bindings for GAA — grep, glob, search, find"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["async", "serde-json", "napi8"] }
napi-derive = "2"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
regex = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
